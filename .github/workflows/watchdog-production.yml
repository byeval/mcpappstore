# Local prepared only. Exact nonce/hash arm commit required; root approval before arm push.
name: Initial anchor rollback watchdog
on:
  push:
    branches: [rollback-watchdog-20261118]
permissions:
  contents: read
  actions: read
concurrency:
  group: mcpapp-initial-anchor-watchdog
  cancel-in-progress: false
jobs:
  monitor:
    if: github.ref == 'refs/heads/rollback-watchdog-20261118' && github.event_name == 'push' && startsWith(github.event.head_commit.message, '[arm-initial-anchor:')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WATCHDOG_PUBLIC_ARM_APPROVED: 'true'
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: node --test scripts/rollback-watchdog*.test.mjs
      - name: Start monitor and await genuine armed receipt
        run: |
          mkdir -p reports/production-watchdog
          (set +e; node scripts/rollback-watchdog-production.mjs > reports/production-watchdog/monitor.log 2>&1; echo $? > reports/production-watchdog/monitor.exit) </dev/null &
          for i in $(seq 1 60); do
            test ! -f reports/production-watchdog/monitor.exit || exit 1
            if test -f reports/production-watchdog/armed.json; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Confirm monitor is alive before publishing armed artifact
        run: |
          test ! -f reports/production-watchdog/monitor.exit
          node -e "process.kill(require('./reports/production-watchdog/monitor.json').pid,0)"
      - uses: actions/upload-artifact@v4
        with:
          name: initial-anchor-watchdog-armed
          path: |
            reports/production-watchdog/armed.json
            reports/production-watchdog/plan.json
            reports/production-watchdog/monitor.json
          if-no-files-found: error
      - name: Await independent monitor terminal result
        if: always()
        run: |
          test -f reports/production-watchdog/monitor.json || exit 1
          for i in $(seq 1 1560); do
            if test -f reports/production-watchdog/monitor.exit; then
              test "$(cat reports/production-watchdog/monitor.exit)" = 0
              exit $?
            fi
            sleep 1
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: initial-anchor-watchdog-evidence
          path: reports/production-watchdog/
          if-no-files-found: error
