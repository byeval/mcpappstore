name: Read-only Astro release preflight
on:
  push:
    branches: [astro-migration-20261116]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - name: Inspect only; never deploy or migrate
        run: node scripts/release-preflight.mjs
        env:
          ASTRO_PUBLICATION_CONFIG: ${{ github.workspace }}/scripts/publication.config.json
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
