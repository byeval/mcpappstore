name: Read-only private Workers durable evidence
'on':
  push:
    branches: [astro-workers-plan-readonly-20261116]
permissions:
  contents: read
jobs:
  durable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read frozen private invocation evidence only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_PLAN_SHA256: e0f2946ed25ac9279d0dea7be51b28227cf3f831f4782d23f7533205c0c4595d
        run: node .github/durable/ci-reader-cli.mjs .github/durable/read-plan.json
      - name: Preserve bounded sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durable-private-evidence
          path: report.json
          if-no-files-found: error
          retention-days: 7
