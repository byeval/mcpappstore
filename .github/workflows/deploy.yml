name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 210

    steps:
      - name: Start bounded release clock
        run: echo "MCPAPP_JOB_STARTED_AT=$(node -p 'Date.now()')" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Discovery and analytics regression checks
        run: node --import tsx --test scripts/discovery.test.ts scripts/browser-analytics.test.ts scripts/sitemap-discovery.test.ts scripts/seo-metadata.test.ts frontend/tests/home-migration.test.tsx

      - name: Publication and authoritative data regression checks
        run: |
          node --test scripts/*.test.mjs
          node --import tsx --test tests/backend-data.test.ts tests/backend-marker.test.ts tests/backend-release.test.ts tests/backend-removals.test.ts tests/backend-security.test.ts

      - name: Catalog evidence and localization audit
        run: npm run audit:seo

      - name: Prepare exact source and public snapshot
        run: npm run deploy
        env:
          MCPAPP_DEPLOY_PHASE: prepare
          GH_TOKEN: ${{ github.token }}
          ASTRO_PUBLICATION_CONFIG: ${{ github.workspace }}/scripts/publication.config.json
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Preserve prepared build payload
        timeout-minutes: 12
        run: node scripts/preserve-prepared.mjs --receipt "$(node -p 'JSON.parse(require("fs").readFileSync("reports/ci-prepared-pointer.json")).receiptPath')" --output reports

      - name: Upload immutable prepared payload
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: prepared-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
          path: |
            reports/prepared-release.tar.gz
            reports/prepared-release.manifest.json
            reports/ci-prepared-pointer.json

      - name: Deploy
        id: deploy
        run: |
          set +e
          npm run deploy
          code=$?
          set -e
          echo "release_exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 78 ]; then exit "$code"; fi
        env:
          MCPAPP_DEPLOY_PHASE: activate
          GH_TOKEN: ${{ github.token }}
          ASTRO_PUBLICATION_CONFIG: ${{ github.workspace }}/scripts/publication.config.json
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Preserve exact-release browser verification ticket
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: reports/browser-verification-ticket.json

      - name: Await exact browser verification or record retained unverified release
        if: always() && steps.deploy.outputs.release_exit == '78'
        timeout-minutes: 45
        run: node scripts/await-browser-release.mjs --ticket "${{ github.workspace }}/reports/browser-verification-ticket.json"
        env:
          GH_TOKEN: ${{ github.token }}
          ASTRO_PUBLICATION_CONFIG: ${{ github.workspace }}/scripts/publication.config.json
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Preserve browser-resolution and retained-failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-resolution-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            reports/browser-verification-ticket.json*
            reports/retained-unverified-failure.json
            reports/release-failure-diagnostic.json
            reports/public-baseline-preflight.json
