name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Discovery and analytics regression checks
        run: node --import tsx --test scripts/discovery.test.ts scripts/browser-analytics.test.ts scripts/sitemap-discovery.test.ts

      - name: Publication and authoritative data regression checks
        run: |
          node --test scripts/*.test.mjs
          node --import tsx --test tests/backend-data.test.ts tests/backend-marker.test.ts tests/backend-release.test.ts tests/backend-removals.test.ts tests/backend-security.test.ts

      - name: Catalog evidence and localization audit
        run: npm run audit:seo

      - name: Deploy
        run: npm run deploy
        env:
          ASTRO_PUBLICATION_CONFIG: ${{ github.workspace }}/scripts/publication.config.json
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Preserve exact-release browser verification ticket
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: reports/browser-verification-ticket.json
