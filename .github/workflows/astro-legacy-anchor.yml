name: Establish corrected legacy rollback anchor
on:
  workflow_dispatch:
    inputs:
      private_preview_run_id:
        description: Completed exact-HEAD private-preview run containing verified full preview receipt
        required: true
      approved_anchor:
        description: Deploy corrected public legacy only; leave Astro frontend unactivated pending browser verification
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-main
  cancel-in-progress: false
jobs:
  anchor:
    if: inputs.approved_anchor && github.ref == 'refs/heads/astro-migration-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.private_preview_run_id }}
          name: astro-private-preview-${{ github.sha }}
          path: reports/anchor-input
      - run: node scripts/establish-legacy-anchor.mjs --preview-report "${{ github.workspace }}/reports/anchor-input/staged-preview-receipt.json"
        env:
          GH_TOKEN: ${{ github.token }}
          ASTRO_PUBLICATION_CONFIG: ${{ github.workspace }}/scripts/publication.config.json
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-anchor-browser-ticket-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            reports/browser-verification-ticket.json
            reports/private-preview-logs/*.log
