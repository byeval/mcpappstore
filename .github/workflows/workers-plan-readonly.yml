name: Read-only Workers plan check
'on':
  push:
    branches: [astro-workers-plan-readonly-20261116]
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read existing account subscription plan
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          let result = { http: null, success: false, plans: [] };
          try {
            if (!/^[a-f0-9]{32}$/.test(account ?? '') || !token) throw new Error('Missing existing credentials');
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/subscriptions`, {
              method: 'GET',
              headers: { Authorization: `Bearer ${token}` },
              redirect: 'error',
              signal: AbortSignal.timeout(30_000),
            });
            result.http = response.status;
            const body = await response.json();
            result.success = response.ok && body.success === true && Array.isArray(body.result);
            if (result.success) {
              const safe = value => typeof value === 'string' ? value.slice(0, 120) : null;
              result.plans = body.result.map(subscription => ({
                rate_plan: {
                  id: safe(subscription.rate_plan?.id),
                  public_name: safe(subscription.rate_plan?.public_name),
                  name: safe(subscription.rate_plan?.name),
                },
                state: safe(subscription.state),
              }));
            }
          } catch {
            // Never print exception objects, raw responses, credentials, or billing identifiers.
          }
          console.log(JSON.stringify(result));
          if (result.http === null) process.exitCode = 1;
          NODE
