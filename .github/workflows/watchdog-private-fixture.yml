name: Private watchdog transport fixture (no production)
on:
  push:
    branches: [rollback-watchdog-20261118]
  workflow_dispatch:
    inputs:
      approved_private_fixture:
        type: boolean
        required: true
        default: false
      scenario:
        type: choice
        options: [rollback, superseded]
        default: rollback
permissions:
  contents: read
  actions: read
concurrency:
  group: watchdog-private-fixture
  cancel-in-progress: false
jobs:
  private-fixture:
    if: github.ref == 'refs/heads/rollback-watchdog-20261118' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[watchdog-private-fixture]')) || (github.event_name == 'workflow_dispatch' && inputs.approved_private_fixture))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRIVATE_WATCHDOG_FIXTURE_APPROVED: 'true'
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: npm ci --ignore-scripts
      - run: node --test scripts/rollback-watchdog*.test.mjs
      - run: node scripts/rollback-watchdog-fixture.mjs prepare
      - name: Start persistent monitor and await real armed handshake
        run: |
          (set +e; node scripts/rollback-watchdog-fixture.mjs monitor > reports/watchdog-fixture/monitor.log 2>&1; echo $? > reports/watchdog-fixture/monitor.exit) </dev/null &
          for i in $(seq 1 45); do
            test ! -f reports/watchdog-fixture/monitor.exit || exit 1
            if test -f reports/watchdog-fixture/armed.json; then exit 0; fi
            sleep 1
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: private-watchdog-armed
          path: |
            reports/watchdog-fixture/armed.json
            reports/watchdog-fixture/envelope.json
            reports/watchdog-fixture/plan.json
          if-no-files-found: error
      - run: node scripts/rollback-watchdog-fixture.mjs candidate
      - if: inputs.scenario == 'superseded'
        run: |
          for i in $(seq 1 30); do
            if test -f reports/watchdog-fixture/owned.json; then break; fi
            sleep 1
          done
          node scripts/rollback-watchdog-fixture.mjs supersede
      - name: Await server-side monitor terminal evidence
        if: always()
        run: |
          test -f reports/watchdog-fixture/monitor.json || { echo "Monitor did not start; no protection was armed"; exit 1; }
          for i in $(seq 1 480); do
            if test -f reports/watchdog-fixture/monitor.exit; then
              test "$(cat reports/watchdog-fixture/monitor.exit)" = 0
              exit $?
            fi
            sleep 1
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-watchdog-evidence
          path: |
            reports/watchdog-fixture/
            reports/private-preview-logs/
          if-no-files-found: error
